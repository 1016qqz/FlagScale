system:
  batch_size: 1
  train_steps: 100000
  log_freq: 10
  grad_clip_norm: 1.0
  use_amp: true
  shuffle: false
  num_workers: 0

  checkpoint:
    output_directory: ${experiment.exp_dir}
    # Whether to save checkpoint
    save_checkpoint: true
    # Number of steps between checkpoints
    save_freq: 1000
  # TODO(yupu): Support resuming from checkpoint

model:
  model_name: pi0
  # Path to the pretrained pi0_base model checkpoint
  checkpoint_dir: /workspace/models/lerobot/pi0_base
  # Path to paligemma tokenizer
  tokenizer_path: /workspace/models/google/paligemma-3b-pt-224
  tokenizer_max_length: 48
  action_steps: 50

  optimizer:
    name: AdamW
    lr: 2.5e-5
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 0.01
    scheduler:
      warmup_steps: 1000
      decay_steps: 30000
      decay_lr: 2.5e-6

data:
  # Path to the training data (LIBERO dataset in LeRobot v3.0 format)
  # TODO: Change to your actual LIBERO v3.0 dataset path on 910C
  data_path: /workspace/datasets/lerobot/libero_goal_no_noops_1.0.0_lerobot
  tolerance_s: 0.0001
  use_imagenet_stats: true
  # LIBERO dataset keys -> PI0 model expected keys
  # LIBERO has 2 cameras, PI0 expects 3; the missing one (right_wrist_0_rgb) is auto-padded
  rename_map:
    observation.images.image: observation.images.base_0_rgb
    observation.images.wrist_image: observation.images.left_wrist_0_rgb
  use_quantiles: false
